name: 'CryptoGuard Action'
description: 'SLSA Level 3 deployment action - receives provenance from isolated VM, uploads to Walrus, updates Sui blockchain'
author: 'CryptoGuard'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  domain:
    description: 'Domain registered on CryptoGuard'
    required: true
  provenance-file:
    description: 'Path to SLSA provenance file from slsa-github-generator'
    required: true
  manifest-file:
    description: 'Path to manifest.json (framework routing)'
    required: true
  network:
    description: 'Sui network (testnet/mainnet)'
    required: false
    default: 'testnet'
  sui-rpc-url:
    description: 'Custom Sui RPC URL (optional)'
    required: false
  walrus-publisher-url:
    description: 'Custom Walrus publisher URL (optional)'
    required: false
  walrus-aggregator-url:
    description: 'Custom Walrus aggregator URL (optional)'
    required: false
  gas-budget:
    description: 'Gas budget for Sui transaction (in MIST)'
    required: false
    default: '10000000'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'

outputs:
  quilt-blob-id:
    description: 'Walrus blob ID of the uploaded quilt (provenance + manifest)'
  tx-digest:
    description: 'Sui transaction digest'
  version:
    description: 'New site version on blockchain'
  site-record-id:
    description: 'Sui SiteRecord object ID'

runs:
  using: 'node20'
  main: 'dist/index.js'

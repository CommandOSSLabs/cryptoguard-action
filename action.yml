name: 'CryptoGuard Action'
description: 'SLSA Level 3 deployment action with blockchain verification'
author: 'CryptoGuard'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  # Required inputs
  domain:
    description: 'Registered domain name for deployment'
    required: true
  provenance-file:
    description: 'Path to SLSA provenance file from slsa-github-generator'
    required: true
  manifest-file:
    description: 'Path to manifest.json file (framework routing info)'
    required: true

  # Network configuration
  network:
    description: 'Sui/Walrus network (testnet/mainnet)'
    required: false
    default: 'testnet'

  # Optional overrides (auto-detected from network)
  sui-rpc-url:
    description: 'Sui RPC endpoint URL (auto-detected from network)'
    required: false
    default: ''
  walrus-publisher-url:
    description: 'Walrus publisher endpoint URL (auto-detected from network)'
    required: false
    default: ''
  walrus-aggregator-url:
    description: 'Walrus aggregator endpoint URL (auto-detected from network)'
    required: false
    default: ''
  gas-budget:
    description: 'Gas budget for blockchain transaction (in MIST)'
    required: false
    default: '10000000'

outputs:
  quilt-blob-id:
    description: 'Walrus blob ID containing provenance + manifest'
  tx-digest:
    description: 'Sui blockchain transaction digest'
  version:
    description: 'New deployment version number'
  site-record-id:
    description: 'Sui SiteRecord object ID'

runs:
  using: 'node20'
  main: 'dist/index.js'

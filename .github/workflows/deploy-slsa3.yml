# CryptoGuard SLSA Level 3 Deploy
# Reusable workflow that provides real SLSA Level 3 provenance
#
# Usage:
#   jobs:
#     deploy:
#       uses: CommandOSSLabs/cryptoguard-action/.github/workflows/deploy-slsa3.yml@v1
#       with:
#         domain: ${{ secrets.DOMAIN }}
#         build-command: "pnpm build"
#         build-dir: ".next"
#       secrets:
#         PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

name: CryptoGuard SLSA Level 3 Deploy

on:
  workflow_call:
    inputs:
      domain:
        description: "Domain registered on CryptoGuard"
        required: true
        type: string
      build-command:
        description: "Build command (e.g., 'pnpm build', 'npm run build')"
        required: true
        type: string
      build-dir:
        description: "Build output directory (e.g., '.next', 'dist', 'build')"
        required: true
        type: string
      manifest-path:
        description: "Path to manifest.json (default: ./manifest.json)"
        required: false
        type: string
        default: "./manifest.json"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "20"
      package-manager:
        description: "Package manager (pnpm, npm, yarn)"
        required: false
        type: string
        default: "pnpm"
      network:
        description: "Sui network (testnet, mainnet)"
        required: false
        type: string
        default: "testnet"
    secrets:
      PRIVATE_KEY:
        description: "Ed25519 private key for signing"
        required: true
    outputs:
      build-artifact-name:
        description: "Name of the build artifact (for downstream jobs)"
        value: ${{ jobs.build.outputs.artifact-name }}
      provenance-artifact-name:
        description: "Name of the provenance artifact"
        value: ${{ jobs.provenance.outputs.provenance-name }}
      quilt-blob-id:
        description: "Walrus blob ID of the quilt"
        value: ${{ jobs.deploy.outputs.quilt-blob-id }}
      sui-tx-digest:
        description: "Sui transaction digest"
        value: ${{ jobs.deploy.outputs.tx-digest }}
      site-version:
        description: "New site version on blockchain"
        value: ${{ jobs.deploy.outputs.version }}

jobs:
  # ===========================================================================
  # Job 1: Build
  # Runs on user's VM - builds the app and computes file hashes
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      artifact-name: build-output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup package manager
      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      # Install dependencies
      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm install

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm ci

      - name: Install dependencies (yarn)
        if: inputs.package-manager == 'yarn'
        run: yarn install --frozen-lockfile

      # Build
      - name: Build
        run: ${{ inputs.build-command }}

      # Copy manifest to build directory
      - name: Copy manifest to build directory
        run: |
          if [ -f "${{ inputs.manifest-path }}" ]; then
            cp "${{ inputs.manifest-path }}" "${{ inputs.build-dir }}/manifest.json"
            echo "Copied manifest.json to build directory"
          else
            echo "Warning: manifest.json not found at ${{ inputs.manifest-path }}"
          fi

      # Generate hashes for SLSA provenance
      - name: Generate file hashes
        id: hash
        run: |
          # Find all files in build directory and compute SHA256 hashes
          # Format: sha256sum output, base64 encoded for passing between jobs
          cd "${{ inputs.build-dir }}"
          HASHES=$(find . -type f -exec sha256sum {} \; | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          echo "Generated hashes for $(find . -type f | wc -l) files"

      # Upload build artifacts (for downstream jobs and SLSA generator)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ inputs.build-dir }}/
          retention-days: 1

  # ===========================================================================
  # Job 2: Provenance (SLSA Level 3)
  # Runs on ISOLATED VM - user cannot tamper with this job
  # Generates cryptographically signed SLSA provenance
  # ===========================================================================
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false

  # ===========================================================================
  # Job 3: Deploy
  # Runs on user's VM - uploads to Walrus and updates Sui blockchain
  # Uses the signed provenance from Job 2 (cannot be forged)
  # ===========================================================================
  deploy:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    outputs:
      quilt-blob-id: ${{ steps.deploy.outputs.quilt-blob-id }}
      tx-digest: ${{ steps.deploy.outputs.tx-digest }}
      version: ${{ steps.deploy.outputs.version }}
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      # Download provenance artifact from Job 2
      # The SLSA generator uploads provenance with artifact name = provenance-name output
      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ./provenance/

      # Download build artifacts (only need manifest.json)
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./build/

      # Find the provenance file (*.intoto.jsonl)
      - name: Locate provenance file
        id: find-provenance
        run: |
          PROVENANCE_FILE=$(find ./provenance -name "*.intoto.jsonl" -o -name "*.intoto" | head -1)
          if [ -z "$PROVENANCE_FILE" ]; then
            echo "Error: No provenance file found"
            ls -la ./provenance/
            exit 1
          fi
          echo "provenance-file=$PROVENANCE_FILE" >> "$GITHUB_OUTPUT"
          echo "Found provenance: $PROVENANCE_FILE"

      # Run CryptoGuard action
      - name: CryptoGuard Deploy
        id: deploy
        uses: CommandOSSLabs/cryptoguard-action@v1
        with:
          domain: ${{ inputs.domain }}
          provenance-file: ${{ steps.find-provenance.outputs.provenance-file }}
          manifest-file: ./build/manifest.json
          network: ${{ inputs.network }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
